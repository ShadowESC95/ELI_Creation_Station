[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-creation"
dynamic = ["version"]
description = "ELI Creation Station: a local studio for socials, images, video, games, editing and code, on ELI's core"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ShadowESC95", email = "jaybridgeman0095@gmail.com" }]
dependencies = [
  # eli-sdk is private: builds fetch its wheel with scripts/fetch_eli_sdk.py (PIP_FIND_LINKS).
  "eli-sdk==1.3.0",
  # Images: the procedural engine, editing, thumbnails and the AI-content marking (HPND).
  "Pillow>=10.3",
  # Memory and processor figures read the same way on every system, for the hardware tiers (BSD-3-Clause).
  "psutil>=5.9",
  # Arrays for the procedural image engine and its quality checks (BSD-3-Clause).
  "numpy>=1.24",
]

[project.optional-dependencies]
# Qt for Python under the LGPL: Essentials (Core, GUI, Widgets, Network) and Addons for Qt
# Multimedia (sound and video, with Qt's LGPL build of FFmpeg). 6.8 brings the frame and sound
# inputs a film is encoded through. GPL-only add-ons are excluded from installers (see the spec).
gui = [
  # PySide6 6.12.0 drops a reference to None on every call to a Qt method that returns nothing,
  # under Python 3.10 and 3.11 (from 3.12 None is immortal and nothing is lost); a window that
  # paints for long enough then aborts ("deallocating None"). Kept off those Pythons until fixed;
  # tests/test_gui.py checks the Qt installed keeps its references.
  "PySide6-Essentials>=6.8,<7; python_version >= '3.12'",
  "PySide6-Addons>=6.8,<7; python_version >= '3.12'",
  "PySide6-Essentials>=6.8,<7,!=6.12.0; python_version < '3.12'",
  "PySide6-Addons>=6.8,<7,!=6.12.0; python_version < '3.12'",
]
# Runs a GGUF main model in process with llama.cpp, as ELI v3 and ELI Legal do. It is compiled on
# install where no prebuilt wheel exists, which needs CMake and a C/C++ compiler.
gguf = [
  "llama-cpp-python>=0.3",
]
# What an installed copy ships with.
all = [
  "PySide6-Essentials>=6.8,<7; python_version >= '3.12'",
  "PySide6-Addons>=6.8,<7; python_version >= '3.12'",
  "PySide6-Essentials>=6.8,<7,!=6.12.0; python_version < '3.12'",
  "PySide6-Addons>=6.8,<7,!=6.12.0; python_version < '3.12'",
]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
build = [
  "pyinstaller>=6.10",
]

[project.scripts]
eli-creation = "eli_creation.cli:main"

[project.gui-scripts]
eli-creation-gui = "eli_creation.gui.app:main"

# How ELI v3 finds this edition once the package is installed beside it.
[project.entry-points."eli.editions"]
creation = "eli_creation.edition:register"

# How ELI v3 finds ELI Creation Station as a bundle it can open in place of its own window.
[project.entry-points."eli.bundles"]
creation = "eli_creation.bundle:describe"

[tool.setuptools.dynamic]
version = { attr = "eli_creation.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eli_creation = [
  "edition/*.json",
  "edition/personas/*.json",
  "edition/templates/*.json",
  "models/*.json",
  "gui/assets/*.png",
  "engines/templates/*.html",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# ELI v3's own modules, copied unchanged (reuse.json): they follow ELI v3's style, and a change to
# them is made in ELI v3 and synced, never here.
extend-exclude = [
  "src/eli_creation/coding",
  "src/eli_creation/engines/image_engine",
  "src/eli_creation/companion/screen_analysis.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/eli_creation"]
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true

# ELI v3's own modules, copied unchanged (see [tool.ruff]).
[[tool.mypy.overrides]]
module = ["eli_creation.coding.*", "eli_creation.engines.image_engine.*", "eli_creation.companion.screen_analysis"]
ignore_errors = true
[[tool.mypy.overrides]]
# numpy's own type stubs (2.4 and later) use Python 3.12 syntax, which a check targeting 3.10
# cannot read; nothing here relies on numpy's types, so it is taken as untyped.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

