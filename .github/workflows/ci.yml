# Adapted from ELI_Legal: .github/workflows/ci.yml @ 3b05ccd88f. Edited for ELI Creation Station; scripts/sync_reused.py --check says when the original changes.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Libraries Qt needs to start without a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64 || \
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0
      # eli-sdk is private: its wheel is fetched with a read-only token and checked against
      # its pinned SHA-256, and every pip install in this job finds it (PIP_FIND_LINKS).
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      - run: python -m pip install -e ".[dev,all]"
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check src tests
      - run: mypy
      # The real probes of this runner, on every system: the tests give the probes their answers,
      # this runs them (no graphics card on a hosted runner: tier T0).
      - run: python -m eli_creation.cli hardware
      - run: python -m eli_creation.cli selftest
      # Nothing personal (home paths, user and host names, e-mail addresses outside the contact
      # files) in what would be published.
      - run: python scripts/check_release.py --check

  # The source installers themselves, run the way a user runs them on a clean machine of each
  # system: they make their own environment, and what they installed starts.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      - name: Install from source (Linux, macOS)
        if: runner.os != 'Windows'
        run: PYTHON=python ./install.sh --no-models
      - name: Install from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -NoModels
      - name: What was installed runs (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ~/.local/bin/eli-creation --version
          ~/.local/bin/eli-creation selftest
      - name: What was installed runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Eli = "$env:LOCALAPPDATA\Programs\ELI Creation Station (source)\eli-creation.cmd"
          & $Eli --version
          if ($LASTEXITCODE -ne 0) { throw "eli-creation did not start" }
          & $Eli selftest
          if ($LASTEXITCODE -ne 0) { throw "the self-test failed" }
      - name: It uninstalls and keeps the data (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --uninstall
          test ! -e ~/.local/opt/eli-creation-src && test ! -e ~/.local/bin/eli-creation
      - name: It uninstalls and keeps the data (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\ELI Creation Station (source)") { throw "the program folder was left behind" }
