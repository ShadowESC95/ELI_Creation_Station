# Adapted from ELI_Legal: .github/workflows/release.yml @ 3b05ccd88f. Edited for ELI Creation Station; scripts/sync_reused.py --check says when the original changes.
# Build the installers for Linux, Windows and macOS and attach them to a GitHub release.
#
#   On a version tag (v*):   build, test, and create a draft release with every installer.
#   Run by hand:             build and test only. Nothing is published. Use it to check the
#                            builds before tagging.
#
# Each job builds on the oldest runner image available, because a frozen build runs on that
# system and anything newer, not older.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag and the version agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/eli_creation/__init__.py').read_text()).group(1))")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, version $VERSION"; exit 1; }
      # libxkbcommon-x11-0 and the xcb-util family: Qt's xcb plugin needs them, and a bundle that
      # carries libxkbcommon without libxkbcommon-x11 crashes on a key press (ELI Legal 0.4.0)
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 libdbus-1-3 libfontconfig1 libpulse0 binutils curl file
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      - run: python -m pip install -c requirements.lock.txt -e ".[all,build]"
      # GGUF main models in process, at the version the graphics packs are built at (two versions'
      # libraries cannot share a process). Built for any x86-64 processor, not just this runner's, and
      # left out (with a note in the build log) if it will not build here.
      - run: python -m pip install -c requirements.lock.txt llama-cpp-python || echo "::warning::llama.cpp did not build; this installer will not run a GGUF main model in process"
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
      # The graphics pack for any maker's card (Vulkan), checked against its SHA-256, shipped inside
      # the installer: an installed copy makes no connection for it.
      - run: python scripts/fetch_gpu_pack.py
      - run: python scripts/check_release.py --check
      - run: PYTHON=python packaging/linux/build.sh
      # What the installers are built from, as a CycloneDX bill of materials published with the
      # release; and a known-vulnerability audit of what they ship. A release is not built over a
      # known, fixable vulnerability (Cyber Resilience Act, Annex I Part II); an exception is
      # allowed only with its reason in packaging/audit_exceptions.txt.
      - name: Bill of materials and known-vulnerability audit
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet "cyclonedx-bom>=7,<10" "pip-audit>=2.7,<3"
          VERSION=$(python -c "import eli_creation; print(eli_creation.__version__)")
          "$RUNNER_TEMP/tools/bin/cyclonedx-py" environment --pyproject pyproject.toml \
            --mc-type application --of JSON \
            -o "dist/installers/ELI_Creation_Station-$VERSION-sbom.cdx.json" "$(command -v python)"
          python -m pip freeze --exclude-editable \
            | python -m eli_creation.security.supply_chain shipped > "$RUNNER_TEMP/shipped.txt"
          IGNORE=$(python -m eli_creation.security.supply_chain ignore-args packaging/audit_exceptions.txt)
          "$RUNNER_TEMP/tools/bin/pip-audit" -r "$RUNNER_TEMP/shipped.txt" --no-deps --disable-pip \
            --progress-spinner off --desc on $IGNORE
      - name: The installer installs, runs and uninstalls; the AppImage runs
        run: |
          sh dist/installers/ELI_Creation_Station-*-linux-*.run --verify
          sh dist/installers/ELI_Creation_Station-*-linux-*.run
          ~/.local/bin/eli-creation --version
          ~/.local/bin/eli-creation selftest
          sh dist/installers/ELI_Creation_Station-*-linux-*.run --uninstall
          dist/installers/ELI_Creation_Station-*-linux-*.AppImage --appimage-extract-and-run --version
          dist/installers/ELI_Creation_Station-*-linux-*.AppImage --appimage-extract-and-run selftest
      # An installed copy starts its seven-day trial on first use, so the window opens on a
      # machine it has never run on, with no key.
      - name: The desktop window opens and takes key presses
        run: |
          sudo apt-get install -y xvfb xdotool
          xvfb-run -a -s "-screen 0 1280x800x24" sh packaging/linux/window_smoke.sh dist/installers/ELI_Creation_Station-*-linux-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: linux
          path: |
            dist/installers/*
            !dist/installers/SHA256SUMS*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup, if the image does not already have it
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $found -and -not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      - run: python -m pip install -c requirements.lock.txt -e ".[all,build]"
      - run: python -m pip install -c requirements.lock.txt llama-cpp-python ; if ($LASTEXITCODE -ne 0) { echo "::warning::llama.cpp did not build"; exit 0 }
        shell: pwsh
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
      - run: python scripts/fetch_gpu_pack.py
      - run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
        env:
          PYTHON: python
      - name: The frozen program runs its self-test
        run: build\dist\eli-creation\eli-creation.exe selftest
      - name: The setup program installs silently, runs and uninstalls
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\installers\*-setup.exe | Select-Object -First 1).FullName
          $target = "$env:RUNNER_TEMP\eli-creation-install"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$target`""
          & "$target\eli-creation.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the installed program does not start" }
          $uninstall = (Get-ChildItem "$target\unins*.exe" | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $uninstall -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if (Test-Path "$target\eli-creation.exe") { throw "the uninstaller left the program behind" }
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: windows
          path: |
            dist/installers/*
            !dist/installers/SHA256SUMS*

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]  # Intel, Apple silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: eli-sdk, from its private release
        run: python scripts/fetch_eli_sdk.py "${{ runner.temp }}/wheels"
        env:
          ELI_SDK_TOKEN: ${{ secrets.ELI_SDK_TOKEN }}
      # cryptography as a published wheel, which carries its own OpenSSL (ELI Legal 0.8.0). There is
      # none for Intel Macs from 49, and 48 has known vulnerabilities (PYSEC-2026-3552, -3553, -3554),
      # so on Intel it is built here at the locked version with OpenSSL linked into it: it then needs no
      # libssl of the system's or the bundle's. (A build that linked the system's failed the licence
      # check inside the app: the bundle's libssl lacked SSL_get0_group_name.)
      - name: cryptography with OpenSSL inside it (Intel Macs)
        if: runner.arch == 'X64'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          CRYPTO=$(grep -E '^cryptography==' requirements.lock.txt | sed -E 's/ *;.*//' | head -1)
          OPENSSL_DIR="$(brew --prefix openssl@3)" OPENSSL_STATIC=1 python -m pip install -c requirements.lock.txt --no-binary cryptography "$CRYPTO"
          lib=$(python -c "import cryptography.hazmat.bindings._rust as r; print(r.__file__)")
          if otool -L "$lib" | grep -E 'libssl|libcrypto'; then echo "::error::cryptography links a shared OpenSSL"; exit 1; fi
          python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K; k = K.generate(); k.public_key().verify(k.sign(b'x'), b'x'); print('cryptography signs and verifies')"
      - run: python -m pip install -c requirements.lock.txt -e ".[all,build]" --only-binary cryptography
      - run: python -m pip install -c requirements.lock.txt llama-cpp-python || echo "::warning::llama.cpp did not build"
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF"
      - run: PYTHON=python packaging/macos/build.sh
      - name: The frozen program runs its self-test
        run: '"build/dist/ELI Creation Station.app/Contents/MacOS/eli-creation" selftest'
      - name: The bundled cryptography carries its own OpenSSL
        run: |
          found=$(find "build/dist/ELI Creation Station.app" -name '_rust*.so' | head -1)
          test -n "$found" && otool -L "$found"
          if otool -L "$found" | grep -E 'libssl|libcrypto'; then echo "::error::the bundled cryptography links a shared OpenSSL"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: macos-${{ matrix.runner }}
          path: |
            dist/installers/*
            !dist/installers/SHA256SUMS*

  release:
    needs: [linux, windows, macos]
    # Publish what was built even if one platform failed, as long as Linux did not.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd installers && sha256sum -- * > SHA256SUMS && cat SHA256SUMS && cd ..
          {
            sed -e "s/@TAG@/$GITHUB_REF_NAME/g" packaging/release_notes.md | grep -v '^<!--'
            echo
            echo "## Built in this run"
            echo
            echo "| Platform | Result |"
            echo "|---|---|"
            echo "| Linux | ${{ needs.linux.result }} |"
            echo "| Windows | ${{ needs.windows.result }} |"
            echo "| macOS | ${{ needs.macos.result }} |"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat installers/SHA256SUMS
            echo '```'
          } > notes.md
      # A re-run replaces the draft an earlier run made. A published release is never touched.
      - run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --title "ELI Creation Station $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
